[sources.otel_input]
type = "opentelemetry"

[sources.otel_input.grpc]
address = "0.0.0.0:4320"

[sources.otel_input.http]
address = "0.0.0.0:4321"

[transforms.logs_transformed]
type = "remap"
inputs = ["otel_input.logs"]
source = '''
.ingestion_timestamp = now()
.data_source = "boomi"
'''

[transforms.metrics_transformed]
type = "remap"
inputs = ["otel_input.metrics"]
source = '''
.ingestion_timestamp = now()
.data_source = "boomi"
'''

[sinks.opensearch_logs]
type = "elasticsearch"
inputs = ["logs_transformed"]
endpoints = ["http://opensearch:9200"]
mode = "bulk"
bulk.index = "boomi-logs"
api_version = "v8"

[sinks.opensearch_metrics]
type = "elasticsearch"
inputs = ["metrics_transformed"]
endpoints = ["http://opensearch:9200"]
mode = "bulk"
bulk.index = "boomi-metrics"
api_version = "v8"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  elasticsearch/logs:
    endpoints: ["https://opensearch:9200"]
    logs_index: boomi-logs
    user: "${OPENSEARCH_USER}"
    password: "${OPENSEARCH_PASSWORD}"
    tls:
      insecure_skip_verify: true
    sending_queue:
      enabled: true
  elasticsearch/metrics:
    endpoints: ["https://opensearch:9200"]
    logs_index: boomi-metrics
    user: "${OPENSEARCH_USER}"
    password: "${OPENSEARCH_PASSWORD}"
    tls:
      insecure_skip_verify: true
    sending_queue:
      enabled: true
  opensearch/traces:
    http:
      endpoint: "https://opensearch:9200"
      timeout: 30s
      headers:
        Authorization: "Basic ${OPENSEARCH_AUTH_HEADER}"
      tls:
        insecure_skip_verify: true
    logs_index: boomi-traces
    sending_queue:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch/metrics]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [opensearch/traces]

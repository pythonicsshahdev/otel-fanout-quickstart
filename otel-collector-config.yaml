receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  opensearch:
    dataset: traces
    namespace: boomi
    logs_index: boomi-traces
    http:
      endpoint: http://opensearch:9200
      timeout: 30s

  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [opensearch, debug]

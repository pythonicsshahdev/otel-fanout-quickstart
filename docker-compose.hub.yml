version: "3"
# Pull-and-run compose file — uses pre-built Docker Hub images.
# No source code required. Run with:
#   docker compose -f docker-compose.hub.yml up -d

services:
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - boomi-net
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - otel-config:/etc/otelcol-contrib
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - boomi-net
    depends_on:
      opensearch:
        condition: service_healthy
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - prometheus-config:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - boomi-net
    depends_on:
      - otel-collector

  grafana:
    image: pythonicshahdev/otel-fanout-grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - boomi-net
    depends_on:
      - opensearch
      - prometheus

  control-plane:
    image: pythonicshahdev/otel-fanout-control-plane:latest
    container_name: control-plane
    ports:
      - "8090:8090"
    environment:
      - CONSUMERS_PATH=/data/consumers.json
      - TEMPLATE_PATH=/templates/otel-collector-config.hbs
      - CONFIG_OUTPUT_PATH=/config/otel-collector-config.yaml
      - COLLECTOR_CONTAINER=otel-collector
      - DEPLOY_TARGET=compose
    volumes:
      - consumers-data:/data
      - otel-config:/config
      - prometheus-config:/prometheus-config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - boomi-net
    depends_on:
      - otel-collector

networks:
  boomi-net:
    driver: bridge

volumes:
  opensearch-data:
  grafana-data:
  consumers-data:
  prometheus-data:
  otel-config:
  prometheus-config:

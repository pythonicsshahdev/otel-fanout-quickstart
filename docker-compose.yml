version: "3"
services:
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - boomi-net
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - boomi-net
    depends_on:
      opensearch:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - boomi-net
    depends_on:
      opensearch:
        condition: service_healthy
    restart: on-failure

  vector:
    image: timberio/vector:latest-alpine
    container_name: vector
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./vector.toml:/etc/vector/vector.toml
    ports:
      - "4319:4317"
      - "4320:4318"
    networks:
      - boomi-net
    depends_on:
      - otel-collector
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - boomi-net
    depends_on:
      - opensearch

  control-plane:
    build:
      context: ./control-plane
    container_name: control-plane
    ports:
      - "8090:8090"
    environment:
      - CONSUMERS_PATH=/data/consumers.json
      - TEMPLATE_PATH=/templates/otel-collector-config.hbs
      - CONFIG_OUTPUT_PATH=/config/otel-collector-config.yaml
      - COLLECTOR_CONTAINER=otel-collector
      - DEPLOY_TARGET=compose
    volumes:
      - consumers-data:/data
      - ./otel-collector-config.hbs:/templates/otel-collector-config.hbs:ro
      - ./otel-collector-config.yaml:/config/otel-collector-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - boomi-net
    depends_on:
      - otel-collector

networks:
  boomi-net:
    driver: bridge

volumes:
  opensearch-data:
  grafana-data:
  consumers-data:

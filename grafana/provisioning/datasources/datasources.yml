apiVersion: 1

datasources:
  - name: OpenSearch Logs
    uid: opensearch-logs
    type: grafana-opensearch-datasource
    access: proxy
    url: https://opensearch:9200
    isDefault: true
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: "${OPENSEARCH_PASSWORD}"
    jsonData:
      timeField: ingestion_timestamp
      version: "3.0.0"
      flavor: opensearch
      logMessageField: message
      logLevelField: severity_number
      database: boomi-logs-*
      tlsSkipVerify: true
    editable: true

  - name: OpenSearch Metrics
    uid: opensearch-metrics
    type: grafana-opensearch-datasource
    access: proxy
    url: https://opensearch:9200
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: "${OPENSEARCH_PASSWORD}"
    jsonData:
      timeField: timestamp
      version: "3.0.0"
      flavor: opensearch
      database: boomi-metrics-*
      tlsSkipVerify: true
    editable: true

  - name: OpenSearch Traces
    uid: opensearch-traces
    type: grafana-opensearch-datasource
    access: proxy
    url: https://opensearch:9200
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: "${OPENSEARCH_PASSWORD}"
    jsonData:
      timeField: startTime
      version: "3.0.0"
      flavor: opensearch
      database: ss4o_traces-traces-*
      tlsSkipVerify: true
    editable: true

  - name: OTel Collector
    uid: otel-collector-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 15s
    editable: true
